plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.nasos'
    compileSdk 34

    defaultConfig {
        applicationId "uz.mango.monitor"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
